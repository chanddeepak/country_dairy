# Render Blueprint — the dev API service.
#
# Written as config rather than clicked into the dashboard so the dev
# environment is reproducible and reviewable. Production is a separate service
# tracking `main`; this one tracks `dev` and exists to test a change before the
# PR that promotes it.
#
# Secrets are declared with `sync: false`, which means Render prompts for them
# once and never stores them in this file. Nothing here should ever hold a key.
services:
  - type: web
    name: country-dairy-api-dev
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free: 512 MB, and the service sleeps after 15 minutes idle, taking about
    # 30 seconds to wake. That is the right trade for an environment that is
    # used in bursts — the only visible cost is a slow first request, and the
    # e2e readiness check already waits two minutes for exactly this.
    plan: free
    region: singapore
    branch: dev
    autoDeploy: true
    healthCheckPath: /api/catalog/products
    envVars:
      # Not "production", and deliberately so. The API refuses to start in
      # production without live Razorpay credentials, because mock mode
      # accepts any payment signature and must never run against real
      # customers. That guard is right; a dev environment simply is not
      # production, and saying otherwise to satisfy it would be a lie that
      # eventually gets believed.
      #
      # The other thing this changes is that localhost origins are accepted,
      # which lets a local frontend talk to the dev API.
      # A fixed sign-in code so the dev site can be walked before WhatsApp
      # exists. The API refuses to boot with this set alongside
      # CASHFREE_ENV=production. Leave it unset to get real random codes.
      #
      # WARNING: the dev site is publicly reachable, so whoever knows this
      # string can sign in as any account in the dev database.
      - key: OTP_DEV_CODE
        sync: false
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 4000

      # Point at a dev database, not production. The container applies
      # migrations to whatever this names before the API starts, so a staging
      # deploy aimed at the production database is the fastest way to lose
      # real orders.
      #
      # DIRECT_URL must bypass the connection pooler — Prisma runs migrations
      # over it, and they cannot run through pgbouncer in transaction mode.
      # Supabase gives both strings; the direct one is port 5432.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # Generated by Render and never seen by anyone, which is what a signing
      # key should be. Dev must not share production's: a token minted here
      # would otherwise be accepted there.
      - key: JWT_SECRET
        generateValue: true

      # Comma-separated. The deployed previews are neither a production origin
      # nor localhost, so without this the console loads and every request
      # fails CORS — which reads as an API outage and is not one.
      - key: ALLOWED_ORIGINS
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Left unset on dev on purpose. Absent keys put Razorpay in mock mode,
      # so a test order cannot take real money. Set these only when the
      # gateway itself is what is being tested, and use test keys.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: SEED_ADMIN_PASSWORD
        sync: false

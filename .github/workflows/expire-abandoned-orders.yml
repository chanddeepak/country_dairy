# Releases stock held by checkouts that were never paid for.
#
# This exists because the application has no scheduler of its own and the free
# Render plan sleeps after fifteen minutes idle, so an in-process cron would
# not fire dependably. A previous run found twenty abandoned orders holding
# stock indefinitely — the symptom is a product showing "out of stock" when
# there is plenty on the shelf, and no signal that anything is wrong.
#
# To switch on, set two repository secrets:
#   CRON_SECRET  — the same value as CRON_SECRET on the API
#   API_BASE_URL — e.g. https://api.countrydairy.in
#
# Until both exist the job exits without calling anything, so merging this
# changes nothing.

name: Expire abandoned orders

on:
  schedule:
    # Every 15 minutes. The sweep only looks at orders older than its own
    # window and asks Cashfree before releasing anything, so calling it often
    # is cheap and calling it late is what costs stock.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Release stock from unpaid checkouts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ] || [ -z "${API_BASE_URL:-}" ]; then
            echo "CRON_SECRET or API_BASE_URL is not set — nothing to do."
            exit 0
          fi

          # --fail-with-body so a 4xx or 5xx fails the run loudly and still
          # prints what the server said. A sweep that silently stops working is
          # the failure this whole workflow exists to prevent.
          curl --silent --show-error --fail-with-body \
               --max-time 120 \
               --retry 2 --retry-delay 10 --retry-connrefused \
               -X POST \
               -H "x-cron-secret: ${CRON_SECRET}" \
               "${API_BASE_URL%/}/orders/cron/expire-abandoned"
          echo
